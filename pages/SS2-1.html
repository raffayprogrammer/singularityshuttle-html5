<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Singularity Shuttle</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #1a1a1a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px 12px;
  }
  #animation_container {
    border: 3px solid #ffffff;
    position: relative;
    width: 684px;
    height: 1795px;
    background-color: rgba(208,208,208,1.00);
  }
  canvas#canvas {
    position: absolute;
    display: block;
    background-color: rgba(208,208,208,1.00);
  }
  #dom_overlay_container {
    pointer-events: none;
    overflow: hidden;
    width: 684px;
    height: 1795px;
    position: absolute;
    left: 0; top: 0;
    display: block;
  }
</style>
</head>
<body>

<div id="animation_container">
  <canvas id="canvas" width="684" height="1795"></canvas>
  <div id="dom_overlay_container"></div>
</div>

<script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>
<script src="SS2-1.js"></script>
<script>
var canvas, stage, exportRoot, anim_container, dom_overlay_container;

var urlMap = {
  "http://www.singularityshuttle.com/index.html": "/",
  "http://www.singularityshuttle.com/":           "/",
  "http://www.singularityshuttle.com/SS2-J.html": "/pages/SS2-J.html",
  "http://www.singularityshuttle.com/SS2-2.html": "/pages/SS2-2.html"
};

function navigate(url) {
  if (url && url.indexOf("mailto:") === 0) {
    window.open(url, "_blank");
  } else {
    window.location.href = urlMap[url] || url;
  }
}

function init() {
  canvas                = document.getElementById("canvas");
  anim_container        = document.getElementById("animation_container");
  dom_overlay_container = document.getElementById("dom_overlay_container");

  var comp = AdobeAn.getComposition("87640522018F644AB3203A1642E950C6");
  var lib  = comp.getLibrary();

  var loader = new createjs.LoadQueue(false);
  loader.installPlugin(createjs.Sound);
  loader.addEventListener("fileload", function(evt){ handleFileLoad(evt, comp); });
  loader.addEventListener("complete", function(evt){ handleComplete(evt, comp); });
  loader.loadManifest(lib.properties.manifest);
}

function handleFileLoad(evt, comp) {
  var images = comp.getImages();
  if (evt && evt.item.type === "image") { images[evt.item.id] = evt.result; }
}

function handleComplete(evt, comp) {
  var lib        = comp.getLibrary();
  var ss         = comp.getSpriteSheet();
  var queue      = evt.target;
  var ssMetadata = lib.ssMetadata;

  for (var i = 0; i < ssMetadata.length; i++) {
    ss[ssMetadata[i].name] = new createjs.SpriteSheet({
      images: [queue.getResult(ssMetadata[i].name)],
      frames: ssMetadata[i].frames
    });
  }

  // loop=false: plays once, stops at last frame
  exportRoot = new lib.SS21_HTML5Canvas(undefined, 0, false);
  stage      = new lib.Stage(canvas);
  stage.enableMouseOver();

  stage.addChild(exportRoot);
  createjs.Ticker.framerate = lib.properties.fps;
  createjs.Ticker.addEventListener("tick", stage);

  // Bind button handlers after first draw
  stage.on("drawend", function wireOnce() {
    stage.off("drawend", wireOnce);
    bindButtons();
  });

  // Fixed size — no responsive scaling. Stage is exactly 684x1795.
  stage.scaleX = 1;
  stage.scaleY = 1;
  canvas.width  = 684;
  canvas.height = 1795;
  AdobeAn.compositionLoaded(lib.properties.id);
}

function bindButtons() {
  var bindings = [
    { inst: exportRoot.instance_54, url: "http://www.singularityshuttle.com/SS2-2.html" },
    { inst: exportRoot.instance_53, url: "http://www.singularityshuttle.com/index.html" },
    { inst: exportRoot.instance_52, url: "http://www.singularityshuttle.com/SS2-J.html" },
    { inst: exportRoot.instance_51, url: "mailto:singularityshuttle@gmail.com" },
    { inst: exportRoot.instance_55, url: "mailto:singularityshuttle@gmail.com" },
    { inst: exportRoot.instance_61, url: "mailto:ransomt@comcast.net" }
  ];
  bindings.forEach(function(b) {
    if (!b.inst) return;
    b.inst.cursor = "pointer";
    b.inst.addEventListener("click", function(){ navigate(b.url); });
  });
}

function playSound(id, loop, offset) {
  return createjs.Sound.play(id, {
    interrupt: createjs.Sound.INTERRUPT_EARLY,
    loop:   loop   || 0,
    offset: offset || 0
  });
}

window.addEventListener("load", init);
</script>

</body>
</html>
